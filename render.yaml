# Render Blueprint for the sign-up API.
#
# Render Dashboard > New > Blueprint > pick this repo. Render reads this file
# and creates the service with everything below already set; the variables
# marked `sync: false` are the ones it stops and asks you for.
#
# Deploying by hand instead? The same values work under
# New > Web Service — see README.md.

services:
  - type: web
    name: little-door-post-api
    runtime: python
    plan: free

    # Keep this next to the database. Every request makes two or three round
    # trips to Neon, so sitting beside it beats sitting beside your readers.
    # Neon is currently in us-west-2, which is Render's `oregon`. If you move
    # the Neon project (Singapore is closer to India), move this to match.
    region: oregon

    branch: main
    autoDeploy: true

    buildCommand: pip install -r requirements.txt

    # --host 0.0.0.0 because the default 127.0.0.1 only accepts connections
    # from inside the container, and Render could not route to it.
    # --port $PORT because Render assigns the port at run time.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Anything other than /api/* is a 404 here, so the default check at / would
    # fail. This one also pings the database, so a deploy that cannot reach
    # Neon is reported as unhealthy rather than quietly accepting traffic.
    healthCheckPath: /api/health

    envVars:
      # requirements.txt pins psycopg[binary], whose wheels are built per
      # Python version. Pinning here keeps a future Render default from
      # landing on a version with no wheel to install.
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Neon connection string. The postgresql+psycopg:// form Neon offers for
      # SQLAlchemy is accepted too — app/config.py normalises the scheme.
      - key: DATABASE_URL
        sync: false

      # Guards /api/admin/*. Use a different value from your local .env.
      - key: ADMIN_TOKEN
        sync: false

      # The site's exact origin: scheme included, no trailing slash, no path.
      # Comma-separate several. Get this wrong and the API looks healthy while
      # every sign-up fails in the browser with a CORS error.
      - key: CORS_ORIGINS
        sync: false

      - key: SUBSCRIPTION_PRICE_INR
        value: "279"

      # "Automatic" opens the 20th and closes the 2nd.
      - key: SIGNUP_WINDOW
        value: Automatic

      # Leave all three blank until Razorpay approves the account. While they
      # are blank the API reports payments as unavailable, sign-ups are saved
      # as pending, and nothing can be charged.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
