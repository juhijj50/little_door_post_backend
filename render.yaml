# Render Blueprint for the sign-up API.
#
# Render Dashboard > New > Blueprint > pick this repo. Render reads this file
# and creates the service with everything below already set; the variables
# marked `sync: false` are the ones it stops and asks you for.
#
# Deploying by hand instead? The same values work under
# New > Web Service — see README.md.

services:
  - type: web
    name: little-door-post-api
    runtime: python
    plan: free

    # Keep this next to the database. Every request makes two or three round
    # trips to Neon, so sitting beside it beats sitting beside your readers.
    #
    # THESE NO LONGER MATCH. The Neon project is in ap-southeast-1 (Singapore)
    # and this service is still in Oregon, so every one of those round trips
    # crosses the Pacific and comes back. Render offers Singapore; moving to it
    # would cut a good deal of latency off every sign-up — but Render cannot
    # change a service's region in place, so it means recreating the service
    # from this Blueprint and setting the variables again.
    region: oregon

    branch: main
    autoDeploy: true

    buildCommand: pip install -r requirements.txt

    # --host 0.0.0.0 because the default 127.0.0.1 only accepts connections
    # from inside the container, and Render could not route to it.
    # --port $PORT because Render assigns the port at run time.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Anything other than /api/* is a 404 here, so the default check at / would
    # fail. This one also pings the database, so a deploy that cannot reach
    # Neon is reported as unhealthy rather than quietly accepting traffic.
    healthCheckPath: /api/health

    envVars:
      # No PYTHON_VERSION on purpose. Pinning it here does nothing unless the
      # service was created from this Blueprint, which is easy to get wrong,
      # and a version Render does not stock fails the build outright.
      # requirements.txt is pinned to releases that publish wheels for current
      # CPython instead, so whichever interpreter Render picks, nothing has to
      # be compiled from source.

      # Neon connection string. The postgresql+psycopg:// form Neon offers for
      # SQLAlchemy is accepted too — app/config.py normalises the scheme.
      - key: DATABASE_URL
        sync: false

      # Guards /api/admin/*. Use a different value from your local .env.
      - key: ADMIN_TOKEN
        sync: false

      # The site's exact origin: scheme included, no trailing slash, no path.
      # Comma-separate several. Get this wrong and the API looks healthy while
      # every sign-up fails in the browser with a CORS error. (Prices and
      # sign-up windows are not here — they live in the database.)
      - key: CORS_ORIGINS
        sync: false

      # ── email ───────────────────────────────────────────────────────────
      # Two go out: a note to Iris when a payment clears, and a confirmation
      # to the reader who paid.
      #
      # BREVO_API_KEY is the one that matters HERE. Render's free tier blocks
      # outbound SMTP (ports 25, 465, 587), so the Gmail settings below cannot
      # send from this service however right the password is — the connection
      # is refused before Gmail sees it. Brevo goes over HTTPS, which is not
      # blocked, and is used in preference whenever it is set.
      #
      # The sender address must be verified in Brevo first: Senders, Domains &
      # Dedicated IPs > Senders. A Gmail address is fine, no domain needed.
      #
      # Check it after a deploy:  POST /api/admin/test-email
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # The SMTP fallback. Works locally and on a paid instance; on the free
      # plan it is blocked, so leave Brevo above doing the work.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_TO
        sync: false

      # Leave all three blank until Razorpay approves the account. While they
      # are blank the API reports payments as unavailable, sign-ups are saved
      # as pending, and nothing can be charged.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
